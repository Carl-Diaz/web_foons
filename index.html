<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foons — Elige tu experiencia</title>
    <link rel="stylesheet" href="index.css" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
</head>

<body>

    <main class="selector">

        <!-- LADO FOONS RESTAURANTE -->
        <a class="concepto concepto--restaurante" href="foons_restaurante/foons_restaurante.html">
            <div class="concepto__fondo"></div>
            <div class="concepto__contenido">
                <div class="concepto__logotipo-marcador">
                    <img src="img/foons_restaurante_logo.png" alt="Foons Restaurante" />
                </div>
                <p class="concepto__subtitulo">Restaurante</p>
                <p class="concepto__descripcion">Sabores del mundo en un solo lugar</p>
                <div class="concepto__boton">Ver carta</div>
            </div>
            <div class="concepto__capa-hover"></div>
        </a>

        <!-- DIVISOR CENTRAL -->
        <div class="divisor">
            <div class="divisor__linea"></div>
            <div class="divisor__icono">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8l5 4-3 4z"
                        fill="currentColor" />
                </svg>
            </div>
            <div class="divisor__linea"></div>
        </div>

        <!-- LADO FOONS AL CARBÓN -->
        <a class="concepto concepto--carbon" href="foons_carbon/foons-carbon.html">
            <div class="concepto__fondo"></div>
            <div class="concepto__contenido">
                <div class="concepto__logotipo-marcador">
                    <img src="img/foons_al_carbon_logo.png" alt="Foons al Carbón" />
                </div>
                <p class="concepto__subtitulo">al Carbón</p>
                <p class="concepto__descripcion">Parrilla artesanal, sabor auténtico</p>
                <div class="concepto__boton">Ver carta</div>
            </div>
            <div class="concepto__capa-hover"></div>
        </a>

    </main>

    <!-- FOOTER MÍNIMO -->
    <footer class="pie-pagina">
        <p>© 2026 Foons · Fonseca La Guajira, Colombia</p>
    </footer>

    <script src="index.js"></script>
</body>

</html>
